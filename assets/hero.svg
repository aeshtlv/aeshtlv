<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" fill="none" role="img" aria-label="deadera — vibe coder">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1200" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#05070d"/>
      <stop offset="0.45" stop-color="#0a1020"/>
      <stop offset="1" stop-color="#08060f"/>
    </linearGradient>

    <linearGradient id="titleGrad" x1="330" y1="0" x2="870" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7cf0ff"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#ff79c6"/>
      <animate attributeName="x1" values="300;880;300" dur="11s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="720;1300;720" dur="11s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="pillGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7cf0ff"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>

    <linearGradient id="sweepGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7cf0ff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#7cf0ff" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#7cf0ff" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="glowA"><stop offset="0" stop-color="#22d3ee" stop-opacity="0.85"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowB"><stop offset="0" stop-color="#8b5cf6" stop-opacity="0.85"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowC"><stop offset="0" stop-color="#ec4899" stop-opacity="0.7"/><stop offset="1" stop-color="#ec4899" stop-opacity="0"/></radialGradient>

    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0v48" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>

    <clipPath id="frame"><rect x="0" y="0" width="1200" height="340" rx="24"/></clipPath>
  </defs>

  <style>
    .blob { transform-box: fill-box; transform-origin: center; }
    #b1 { animation: drift1 14s ease-in-out infinite; }
    #b2 { animation: drift2 18s ease-in-out infinite; }
    #b3 { animation: drift3 22s ease-in-out infinite; }
    @keyframes drift1 { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(110px,46px) scale(1.12); } }
    @keyframes drift2 { 0%,100% { transform: translate(0,0) scale(1.05); } 50% { transform: translate(-120px,60px) scale(0.9); } }
    @keyframes drift3 { 0%,100% { transform: translate(0,0) scale(0.95); } 50% { transform: translate(70px,-50px) scale(1.15); } }

    #sweep { animation: sweep 7s linear infinite; }
    @keyframes sweep { 0% { transform: translateY(-340px); } 100% { transform: translateY(340px); } }

    .caret { animation: blink 1.05s steps(1,end) infinite; }
    @keyframes blink { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }

    .glitch { animation: glitch 6s steps(1,end) infinite; }
    @keyframes glitch {
      0%, 92%, 100% { transform: translate(0,0); opacity: 0; }
      93% { transform: translate(-4px,2px); opacity: 0.75; }
      95% { transform: translate(5px,-2px); opacity: 0.65; }
      97% { transform: translate(-3px,-1px); opacity: 0.55; }
      99% { transform: translate(3px,2px); opacity: 0.4; }
    }

    .pill { animation: pulse 4s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity: 0.75; } 50% { opacity: 1; } }

    .particle { transform-box: fill-box; transform-origin: center; animation: float 9s ease-in-out infinite; }
    @keyframes float {
      0% { transform: translateY(10px) scale(0.6); opacity: 0; }
      25% { opacity: 0.85; }
      75% { opacity: 0.5; }
      100% { transform: translateY(-72px) scale(1); opacity: 0; }
    }
  </style>

  <g clip-path="url(#frame)">
    <rect width="1200" height="340" fill="url(#bgGrad)"/>
    <rect width="1200" height="340" fill="url(#grid)"/>

    <g opacity="0.6">
      <circle id="b1" class="blob" cx="210" cy="90" r="230" fill="url(#glowA)"/>
      <circle id="b2" class="blob" cx="980" cy="120" r="250" fill="url(#glowB)"/>
      <circle id="b3" class="blob" cx="620" cy="330" r="240" fill="url(#glowC)"/>
    </g>

    <rect id="sweep" x="0" y="0" width="1200" height="200" fill="url(#sweepGrad)"/>

    <g>
      <circle class="particle" cx="150" cy="250" r="2.4" fill="#7cf0ff" style="animation-delay:0s"/>
      <circle class="particle" cx="285" cy="205" r="1.8" fill="#a78bfa" style="animation-delay:1.4s"/>
      <circle class="particle" cx="418" cy="270" r="2" fill="#7cf0ff" style="animation-delay:2.9s"/>
      <circle class="particle" cx="742" cy="262" r="2.2" fill="#ff79c6" style="animation-delay:.8s"/>
      <circle class="particle" cx="905" cy="212" r="1.7" fill="#a78bfa" style="animation-delay:3.7s"/>
      <circle class="particle" cx="1042" cy="256" r="2.5" fill="#7cf0ff" style="animation-delay:2.1s"/>
      <circle class="particle" cx="1120" cy="180" r="1.6" fill="#ff79c6" style="animation-delay:4.6s"/>
    </g>

    <!-- corner brackets -->
    <g stroke="#7cf0ff" stroke-opacity="0.35" stroke-width="2" stroke-linecap="round">
      <path d="M28 62V44a16 16 0 0 1 16-16h20"/>
      <path d="M1172 62V44a16 16 0 0 0-16-16h-20"/>
      <path d="M28 278v18a16 16 0 0 0 16 16h20"/>
      <path d="M1172 278v18a16 16 0 0 1-16 16h-20"/>
    </g>

    <!-- pill -->
    <g class="pill">
      <rect x="470" y="56" width="260" height="34" rx="17" fill="#7cf0ff" fill-opacity="0.06" stroke="url(#pillGrad)" stroke-opacity="0.45"/>
      <circle cx="492" cy="73" r="4" fill="#7cf0ff"/>
      <text x="508" y="78" font-family="ui-monospace,SFMono-Regular,'Segoe UI',monospace" font-size="13.5" fill="#9fb4d4" letter-spacing="0.6">// vibe coding in progress</text>
    </g>

    <!-- title -->
    <g font-family="'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-weight="800" text-anchor="middle">
      <text class="glitch" x="598" y="196" font-size="92" letter-spacing="6" fill="#ff79c6" fill-opacity="0.55">deadera</text>
      <text class="glitch" x="602" y="192" font-size="92" letter-spacing="6" fill="#7cf0ff" fill-opacity="0.5">deadera</text>
      <text x="600" y="194" font-size="92" letter-spacing="6" fill="url(#titleGrad)">deadera</text>
      <rect class="caret" x="812" y="128" width="9" height="64" rx="4" fill="#7cf0ff" fill-opacity="0.85"/>
    </g>

    <!-- subtitle -->
    <text x="600" y="248" text-anchor="middle" font-family="'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="19" fill="#8fa3c0" letter-spacing="0.4">Андрей · пишу для души · Python &amp; TypeScript</text>

    <!-- bottom hairline -->
    <rect x="380" y="286" width="440" height="1.4" rx="1" fill="url(#pillGrad)" fill-opacity="0.55"/>
  </g>

  <rect x="0.6" y="0.6" width="1198.8" height="338.8" rx="23.4" stroke="#ffffff" stroke-opacity="0.09" stroke-width="1.2"/>
</svg>
