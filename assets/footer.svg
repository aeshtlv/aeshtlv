<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 150" width="1200" height="150" fill="none" role="img" aria-label="footer">
  <defs>
    <linearGradient id="fBg" x1="0" y1="0" x2="1200" y2="150" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#06070d"/>
      <stop offset="1" stop-color="#0a0813"/>
    </linearGradient>
    <linearGradient id="w1" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#22d3ee" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="w2" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#a78bfa" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="w3" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff79c6" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ff79c6" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ff79c6" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="ff"><rect width="1200" height="150" rx="20"/></clipPath>
  </defs>

  <style>
    @keyframes scrollL { from { transform: translateX(0); } to { transform: translateX(-1200px); } }
    @keyframes scrollR { from { transform: translateX(-1200px); } to { transform: translateX(0); } }
    #waveA { animation: scrollL 11s linear infinite; }
    #waveB { animation: scrollR 16s linear infinite; }
    #waveC { animation: scrollL 23s linear infinite; }
    .dot { animation: pulse 2.4s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: 0.25; } 50% { opacity: 1; } }
  </style>

  <g clip-path="url(#ff)">
    <rect width="1200" height="150" fill="url(#fBg)"/>

    <g stroke-width="2" fill="none">
      <g id="waveA"><path stroke="url(#w1)" d="M0 92 C 200 62, 400 122, 600 92 S 1000 62, 1200 92 S 1600 122, 1800 92 S 2200 62, 2400 92"/></g>
      <g id="waveB"><path stroke="url(#w2)" d="M0 106 C 200 76, 400 136, 600 106 S 1000 76, 1200 106 S 1600 136, 1800 106 S 2200 76, 2400 106"/></g>
      <g id="waveC"><path stroke="url(#w3)" d="M0 80 C 200 50, 400 110, 600 80 S 1000 50, 1200 80 S 1600 110, 1800 80 S 2200 50, 2400 80"/></g>
    </g>

    <g font-family="'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" text-anchor="middle">
      <text x="600" y="64" font-size="21" font-weight="600" fill="#e6edf7">спасибо, что зашёл</text>
      <text x="600" y="90" font-size="14.5" fill="#7d8ba6" letter-spacing="1.2">КЛОНИРУЙ · ЛОМАЙ · ДЕЛАЙ СВОЁ</text>
      <circle class="dot" cx="466" cy="58" r="3" fill="#7cf0ff"/>
      <circle class="dot" cx="734" cy="58" r="3" fill="#ff79c6" style="animation-delay:.6s"/>
    </g>
  </g>

  <rect x="0.6" y="0.6" width="1198.8" height="148.8" rx="19.4" stroke="#ffffff" stroke-opacity="0.09" stroke-width="1.2"/>
</svg>
