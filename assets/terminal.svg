<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 250" width="1200" height="250" fill="none" role="img" aria-label="terminal">
  <defs>
    <linearGradient id="winBg" x1="0" y1="0" x2="1200" y2="250" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0a0f1a"/>
      <stop offset="1" stop-color="#0b0a14"/>
    </linearGradient>
    <linearGradient id="barBg" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#121a2b"/>
      <stop offset="1" stop-color="#13111f"/>
    </linearGradient>

    <clipPath id="clipA"><rect x="46" y="78" width="0" height="28"><animate attributeName="width" values="0;0;96;96;96" keyTimes="0;0.08;0.22;0.9;1" dur="12s" begin="0s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="clipB"><rect x="46" y="130" width="0" height="28"><animate attributeName="width" values="0;0;160;160;160" keyTimes="0;0.30;0.44;0.9;1" dur="12s" begin="0s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="clipC"><rect x="46" y="182" width="0" height="28"><animate attributeName="width" values="0;0;170;170;170" keyTimes="0;0.52;0.66;0.9;1" dur="12s" begin="0s" repeatCount="indefinite"/></rect></clipPath>

    <clipPath id="frame"><rect width="1200" height="250" rx="20"/></clipPath>
  </defs>

  <style>
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    @keyframes cycle { 0% { opacity: 0; } 3% { opacity: 1; } 90% { opacity: 1; } 96% { opacity: 0; } 100% { opacity: 0; } }
    @keyframes winA { 0% { opacity: 0; } 7% { opacity: 0; } 8% { opacity: 1; } 23% { opacity: 1; } 24% { opacity: 0; } 100% { opacity: 0; } }
    @keyframes winB { 0% { opacity: 0; } 29% { opacity: 0; } 30% { opacity: 1; } 45% { opacity: 1; } 46% { opacity: 0; } 100% { opacity: 0; } }
    @keyframes winC { 0% { opacity: 0; } 51% { opacity: 0; } 52% { opacity: 1; } 90% { opacity: 1; } 96% { opacity: 0; } 100% { opacity: 0; } }
    @keyframes outA { 0% { opacity: 0; } 22% { opacity: 0; } 26% { opacity: 1; } 90% { opacity: 1; } 96% { opacity: 0; } 100% { opacity: 0; } }
    @keyframes outB { 0% { opacity: 0; } 44% { opacity: 0; } 48% { opacity: 1; } 90% { opacity: 1; } 96% { opacity: 0; } 100% { opacity: 0; } }
    @keyframes outC { 0% { opacity: 0; } 66% { opacity: 0; } 70% { opacity: 1; } 90% { opacity: 1; } 96% { opacity: 0; } 100% { opacity: 0; } }
    .blink { animation: blink 1s steps(1,end) infinite; }
    .content { animation: cycle 12s linear infinite; }
    .cwA { animation: winA 12s linear infinite; }
    .cwB { animation: winB 12s linear infinite; }
    .cwC { animation: winC 12s linear infinite; }
    .outA { animation: outA 12s linear infinite; }
    .outB { animation: outB 12s linear infinite; }
    .outC { animation: outC 12s linear infinite; }
  </style>

  <g clip-path="url(#frame)">
    <rect width="1200" height="250" fill="url(#winBg)"/>

    <!-- title bar -->
    <path d="M0 20a20 20 0 0 1 20-20h1160a20 20 0 0 1 20 20v18H0z" fill="url(#barBg)"/>
    <rect x="0" y="37" width="1200" height="1" fill="#ffffff" fill-opacity="0.07"/>
    <circle cx="34" cy="19" r="6" fill="#ff5f57"/>
    <circle cx="56" cy="19" r="6" fill="#febc2e"/>
    <circle cx="78" cy="19" r="6" fill="#28c840"/>
    <text x="600" y="24" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'Segoe UI',monospace" font-size="12.5" fill="#6b7b96">deadera@github: ~/profile</text>

    <g class="content" font-family="ui-monospace,SFMono-Regular,Consolas,'Courier New',monospace" font-size="19">
      <!-- line 1 -->
      <g clip-path="url(#clipA)">
        <text x="46" y="99" fill="#7cf0ff">$</text>
        <text x="74" y="99" fill="#e6edf7">whoami</text>
      </g>
      <g class="cwA"><rect class="blink" x="46" y="79" width="10" height="22" rx="2" fill="#7cf0ff" fill-opacity="0.9">
        <animate attributeName="x" values="46;46;142;142;142" keyTimes="0;0.08;0.22;0.9;1" dur="12s" repeatCount="indefinite"/>
      </rect></g>
      <text class="outA" x="46" y="126" fill="#8fa3c0" font-size="17">→ вайбкодер. код — хобби, а не резюме.</text>

      <!-- line 2 -->
      <g clip-path="url(#clipB)">
        <text x="46" y="151" fill="#7cf0ff">$</text>
        <text x="74" y="151" fill="#e6edf7">cat vibe.txt</text>
      </g>
      <g class="cwB"><rect class="blink" x="46" y="131" width="10" height="22" rx="2" fill="#7cf0ff" fill-opacity="0.9">
        <animate attributeName="x" values="46;46;206;206;206" keyTimes="0;0.30;0.44;0.9;1" dur="12s" repeatCount="indefinite"/>
      </rect></g>
      <text class="outB" x="46" y="178" fill="#8fa3c0" font-size="17">→ идея → промпт → ещё идея → 3 ночи → работает. не спрашивай как.</text>

      <!-- line 3 -->
      <g clip-path="url(#clipC)">
        <text x="46" y="203" fill="#7cf0ff">$</text>
        <text x="74" y="203" fill="#e6edf7">ls ~/projects</text>
      </g>
      <g class="cwC"><rect class="blink" x="46" y="183" width="10" height="22" rx="2" fill="#7cf0ff" fill-opacity="0.9">
        <animate attributeName="x" values="46;46;216;216;216" keyTimes="0;0.52;0.66;0.9;1" dur="12s" repeatCount="indefinite"/>
      </rect></g>
      <text class="outC" x="46" y="230" fill="#8fa3c0" font-size="17">→ Flushot  GiftTinder  shftsecure  GiftPortfolio</text>
    </g>
  </g>

  <rect x="0.6" y="0.6" width="1198.8" height="248.8" rx="19.4" stroke="#ffffff" stroke-opacity="0.09" stroke-width="1.2"/>
</svg>
