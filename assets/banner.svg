<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" width="1200" height="240" fill="none" role="img" aria-label="decorative banner">
  <defs>
    <linearGradient id="bBg" x1="0" y1="0" x2="1200" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#05070d"/>
      <stop offset="0.5" stop-color="#080d1a"/>
      <stop offset="1" stop-color="#07050e"/>
    </linearGradient>

    <radialGradient id="bGlowA"><stop offset="0" stop-color="#22d3ee" stop-opacity="0.55"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
    <radialGradient id="bGlowB"><stop offset="0" stop-color="#8b5cf6" stop-opacity="0.5"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></radialGradient>
    <radialGradient id="bGlowC"><stop offset="0" stop-color="#ec4899" stop-opacity="0.35"/><stop offset="1" stop-color="#ec4899" stop-opacity="0"/></radialGradient>

    <linearGradient id="bLine" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7cf0ff" stop-opacity="0"/>
      <stop offset="0.25" stop-color="#7cf0ff" stop-opacity="0.75"/>
      <stop offset="0.5" stop-color="#a78bfa" stop-opacity="0.9"/>
      <stop offset="0.75" stop-color="#ff79c6" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#ff79c6" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="bSweep" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7cf0ff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#7cf0ff" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#7cf0ff" stop-opacity="0"/>
    </linearGradient>

    <pattern id="bGrid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0v48" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>

    <clipPath id="bFrame"><rect width="1200" height="240" rx="20"/></clipPath>
  </defs>

  <style>
    .blob { transform-box: fill-box; transform-origin: center; }
    #g1 { animation: drift1 16s ease-in-out infinite; }
    #g2 { animation: drift2 20s ease-in-out infinite; }
    #g3 { animation: drift3 24s ease-in-out infinite; }
    @keyframes drift1 { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(140px,38px) scale(1.15); } }
    @keyframes drift2 { 0%,100% { transform: translate(0,0) scale(1.05); } 50% { transform: translate(-150px,44px) scale(0.88); } }
    @keyframes drift3 { 0%,100% { transform: translate(0,0) scale(0.95); } 50% { transform: translate(90px,-34px) scale(1.12); } }

    #sweep { animation: sweep 8s linear infinite; }
    @keyframes sweep { 0% { transform: translateY(-240px); } 100% { transform: translateY(240px); } }

    #beam { animation: beamShift 12s ease-in-out infinite; }
    @keyframes beamShift { 0%,100% { opacity: 0.45; } 50% { opacity: 1; } }

    .spark { transform-box: fill-box; transform-origin: center; animation: rise 10s ease-in-out infinite; }
    @keyframes rise {
      0% { transform: translateY(18px) scale(0.5); opacity: 0; }
      20% { opacity: 0.9; }
      70% { opacity: 0.45; }
      100% { transform: translateY(-70px) scale(1.05); opacity: 0; }
    }
  </style>

  <g clip-path="url(#bFrame)">
    <rect width="1200" height="240" fill="url(#bBg)"/>
    <rect width="1200" height="240" fill="url(#bGrid)"/>

    <g>
      <circle id="g1" class="blob" cx="170" cy="60" r="220" fill="url(#bGlowA)"/>
      <circle id="g2" class="blob" cx="1010" cy="70" r="235" fill="url(#bGlowB)"/>
      <circle id="g3" class="blob" cx="590" cy="250" r="215" fill="url(#bGlowC)"/>
    </g>

    <rect id="sweep" x="0" y="0" width="1200" height="170" fill="url(#bSweep)"/>

    <g>
      <circle class="spark" cx="118" cy="196" r="2.1" fill="#7cf0ff" style="animation-delay:0s"/>
      <circle class="spark" cx="248" cy="150" r="1.6" fill="#a78bfa" style="animation-delay:1.7s"/>
      <circle class="spark" cx="392" cy="205" r="1.9" fill="#7cf0ff" style="animation-delay:3.3s"/>
      <circle class="spark" cx="536" cy="168" r="1.5" fill="#ff79c6" style="animation-delay:5.1s"/>
      <circle class="spark" cx="688" cy="200" r="2.2" fill="#a78bfa" style="animation-delay:2.4s"/>
      <circle class="spark" cx="824" cy="156" r="1.7" fill="#7cf0ff" style="animation-delay:4.4s"/>
      <circle class="spark" cx="962" cy="198" r="2" fill="#ff79c6" style="animation-delay:6.2s"/>
      <circle class="spark" cx="1092" cy="162" r="1.6" fill="#7cf0ff" style="animation-delay:7.8s"/>
    </g>

    <g id="beam">
      <rect x="0" y="219" width="1200" height="2" fill="url(#bLine)"/>
      <rect x="0" y="213" width="1200" height="14" fill="url(#bLine)" opacity="0.18"/>
    </g>
  </g>

  <rect x="0.6" y="0.6" width="1198.8" height="238.8" rx="19.4" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1.2"/>
</svg>
